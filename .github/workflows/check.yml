name: Check
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/reference-count.php
      - run: php tests/page-settings-scan.php
      - run: php tests/acf-scan.php
      - run: node --check assets/js/admin.js
      - run: node tests/admin-ui.test.js
